<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout — Maisoné</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><div class="announcement">Secure checkout <span>•</span> Your information is protected</div><header class="site-header checkout-head"><a class="logo" href="index.html">Maisoné<span>.</span></a><span class="secure">🔒 Secure checkout</span></header>
<main class="checkout-page"><div class="checkout-form"><p class="eyebrow">Checkout</p><h1>Complete your order</h1><form id="checkoutForm"><h3>Contact</h3><input type="email" required placeholder="Email address"><h3>Delivery</h3><div class="two-input"><input required placeholder="First name"><input required placeholder="Last name"></div><input required placeholder="Address"><div class="two-input"><input required placeholder="City"><input required placeholder="Postal code"></div><input required placeholder="Phone number"><h3>Payment</h3><div class="payment-box">Cash on delivery <span>✓</span></div><button class="btn btn-dark full">Place order</button></form></div><aside class="order-summary"><h3>Order summary</h3><div id="checkoutItems"></div><div class="summary-line"><span>Subtotal</span><b id="checkoutSubtotal">$0.00</b></div><div class="summary-line"><span>Shipping</span><b id="checkoutShipping">Free</b></div><div class="summary-line"><span>Tax (5%)</span><b id="checkoutTax">$0.00</b></div><div class="summary-total"><span>Total</span><b id="checkoutTotal">$0.00</b></div></aside></main><div id="toast" class="toast"></div><script src="js/script.js"></script><script>renderCheckout();</script></body></html>
